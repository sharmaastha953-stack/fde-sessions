services:
  python-img:
    build: .
    container_name: python-container
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/varlib/mysql
volumes:
  mysql-data:
